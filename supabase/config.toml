# Configuração das Edge Functions do Go XL.
#
# Por padrão, o gateway do Supabase exige um Authorization header válido
# (JWT) em TODA requisição, retornando 401 UNAUTHORIZED_NO_AUTH_HEADER antes
# mesmo do código da função rodar. Isso quebra a página HTML de retorno do
# Stripe Checkout (o navegador do usuário chega via redirect após cadastrar
# o cartão, sem nenhum header de auth do Supabase).
#
# setup-card e connect-onboard-driver servem páginas de retorno públicas
# (GET), mas continuam fazendo sua PRÓPRIA validação interna (getUser()) no
# POST, que é a parte que realmente precisa de autenticação.

[functions.setup-card]
verify_jwt = false

[functions.connect-onboard-driver]
verify_jwt = false

# track-trip serve a página PÚBLICA de rastreio ao vivo (GET, sem login). O
# contato de confiança chega pelo link com um TOKEN opaco; a função valida o
# token + expiração com service_role e devolve só campos whitelistados.
[functions.track-trip]
verify_jwt = false

# resolve-driver-code traduz o código do QR em `{ id, full_name }` para o
# Cadastro Expresso, que roda ANTES de a conta existir (não há JWT para
# validar). Substitui o SELECT anônimo na view `profiles_public`, revogado na
# migration 0067 — ver o cabeçalho da função. Superfície mínima: lookup de 1
# código por vez, 2 colunas, só perfis `type = 'driver'`, com rate limit por
# IP em duas janelas.
[functions.resolve-driver-code]
verify_jwt = false
